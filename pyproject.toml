[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toolbench"
version = "0.0.1"
description = "A benchmarking framework for AI tools and agents."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Tony Menzo" },
]
keywords = ["benchmark", "ai", "agents", "tools", "llm"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/tonymenzo/toolbench"
Repository = "https://github.com/tonymenzo/toolbench"
Issues = "https://github.com/tonymenzo/toolbench/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/toolbench"]

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>toolbench dashboard</title>
  <link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">toolbench</span>
      <span class="brand-sep" aria-hidden="true">/</span>
      <span id="campaign-name" class="campaign-name">…</span>
    </div>
    <div class="topbar-meta">
      <span id="refresh-state" class="refresh-state" aria-live="polite"></span>
      <button id="theme-toggle" class="icon-button" type="button"
              aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>
    </div>
  </header>

  <main>
    <section id="overview" class="overview" aria-label="Campaign overview"></section>

    <div class="workspace">
      <aside class="runs-pane" aria-label="Runs">
        <div class="pane-head">
          <h2>Runs</h2>
          <div id="run-filter" class="segmented" role="group" aria-label="Filter runs">
            <button type="button" data-filter="all" aria-pressed="true">All</button>
            <button type="button" data-filter="live" aria-pressed="false">Live</button>
            <button type="button" data-filter="attention" aria-pressed="false">Attention</button>
          </div>
        </div>
        <ul id="run-list" class="run-list"></ul>
      </aside>

      <section id="run-detail" class="run-detail" aria-label="Run detail">
        <p class="empty">Select a run.</p>
      </section>
    </div>
  </main>

  <aside id="trial-drawer" class="drawer" aria-label="Trial detail" hidden>
    <div class="drawer-head">
      <div>
        <div class="eyebrow">Trial</div>
        <h3 id="drawer-title"></h3>
      </div>
      <button id="drawer-close" class="icon-button" type="button" aria-label="Close">✕</button>
    </div>
    <div id="drawer-body" class="drawer-body"></div>
  </aside>

  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>

  <script src="/static/dashboard.js"></script>
</body>
</html>
